name: smarket-ci

on: # 지정한 이벤트가 해당 브랜치에서 발생할 때 Github Action 동작
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs: # 여러 Step으로 구성되고, 각 step 들은 가상 환경의 인스턴스에서 실행됨.
  build:
    runs-on: ubuntu-20.04 # 가상환경 OS

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name : Set up JDK 17 # 자바 버전
        uses: actions/setup-java@v1
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: create mysql docker container # 가상환경에 mysql 컨테이너 생성
        run: |
          sudo docker run -d -p 3306:3306 --env MYSQL_DATABASE=Smarket --env MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_PASSWORD }} mysql:8.0.23

      - name : Grant execute permission for gradlew # 권한 추가
        run: chmod +x ./gradlew
        shell: bash

      - name : Build with Gradle # gradle로 빌드
        run: ./gradlew clean build --stacktrace
        shell: bash

      - name: Set up Docker Buildx # Dockerfile 빌드로 DockerImage 생성
        uses: docker/setup-buildx-action@v1

      - name : Debug Secrets
        env :
          DOCKER_USERNAME : ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run : |
          echo "Username : $DOCKER_USERNAME"
          echo "Password : $DOCKER_PASSWORD"

      - name: Login to DockerHub # DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push # DockerHub로 DockerImage Push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_TAG }}

      - name: Get Current Time
        uses: 1466587594/get-current-time@v2
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          utcOffset: "+09:00"

      - name: Show Current Time
        run: echo "CurrentTime=${{steps.current-time.outputs.formattedTime}}"
        shell: bash